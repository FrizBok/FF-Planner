services:
  planner:
    build: .
    image: ff-planner:latest
    container_name: ff-planner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TZ=Europe/Berlin
      # Hinter einem Reverse-Proxy mit HTTPS auf true setzen:
      - TRUST_PROXY=false
      - PORTAL_URL=
      - PORTAL_SSO_SECRET=        # = PLANNER_SSO_SECRET im Portal
      - RUNDOWN_URL=
      - RUNDOWN_API_SECRET=       # = PLANNER_API_SECRET in FF Rundown
    volumes:
      - ./data:/data
